name: masar_rep_app
description: تطبيق المندوب لنظام مسار المحاسبي
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  geolocator: ^13.0.2
  mobile_scanner: ^7.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  file_picker: ^8.1.7
  image: ^4.5.4
  image_picker: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/masar_logo.png
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSans-Regular.ttf
